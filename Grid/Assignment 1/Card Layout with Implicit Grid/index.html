<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Card Layout</h1>
    <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=400&q=80">
            <h3>Laptop</h3>
            <p>Modern laptop for work and study.</p>
        </div>
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=400&q=80">
            <h3>Technology</h3>
            <p>Latest technology and digital world.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=400&q=80">
            <h3>Team Work</h3>
            <p>Working together makes success.</p>
        </div>
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=400&q=80">
            <h3>Office</h3>
            <p>Professional workspace environment.</p>
        </div>
        
        <div class="card">
            <img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=400&q=80">
            <h3>Business</h3>
            <p>Business planning and growth.</p>
        </div>
    </div>

</body>
</html>
